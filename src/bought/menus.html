<!-- Header mega menus and footer accordions for the purchased pages. The
     supplied snapshots had their scripts removed, so their menus were empty.
     Contents are transcribed from the founder's screenshots of the seller site. -->
<style>
.mm-panel{position:fixed;left:50%;transform:translateX(-50%);top:5.25rem;width:min(1180px,calc(100vw - 2rem));z-index:9999;background:#fff;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 20px 50px -12px rgba(15,23,42,.18);padding:24px;display:none;font-family:Inter,system-ui,sans-serif;color:#0f172a;max-height:calc(100vh - 6.5rem);overflow:auto}
.mm-panel.open{display:grid;grid-template-columns:300px 1fr;gap:28px}
.mm-hero{border-radius:16px;padding:22px;background:linear-gradient(160deg,#f5f3ff,#ede9fe)}
.mm-hero.orange{background:linear-gradient(160deg,#fff7ed,#ffedd5)}
.mm-hero .ic{width:56px;height:56px;border-radius:14px;background:#7c3aed;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}
.mm-hero.orange .ic{background:#f97316}
.mm-badge{float:right;font-size:12px;font-weight:700;color:#fff;background:#22c55e;border-radius:99px;padding:3px 10px;letter-spacing:.03em}
.mm-badge.p{background:#8b5cf6}.mm-badge.o{background:#f97316}
.mm-hero h4{font-size:21px;font-weight:500;margin:18px 0 6px}
.mm-hero p{color:#475569;font-size:15px;margin:0 0 10px;line-height:1.45}
.mm-btn{display:inline-block;margin-top:8px;background:#fff;border-radius:99px;padding:9px 18px;font-size:15px;color:#7c3aed;box-shadow:0 2px 8px rgba(0,0,0,.08);text-decoration:none}
.mm-hero.orange .mm-btn{color:#ea580c}
.mm-label{font-size:13px;letter-spacing:.08em;color:#64748b;text-transform:uppercase;margin:22px 0 10px}
.mm-dot::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#6366f1;margin-right:10px;vertical-align:middle}
.mm-dot.g::before{background:#10b981}.mm-dot.r::before{background:#ef4444}.mm-dot.o::before{background:#f97316}.mm-dot.pk::before{background:#ec4899}
.mm-list a{display:block;color:#334155;font-size:16px;padding:6px 0;text-decoration:none}
.mm-list a:hover,.mm-cols a:hover{color:#7c3aed}
.mm-cols{display:grid;gap:24px}
.mm-cols a{color:#1e293b;text-decoration:none}
.mm-banner{display:flex;align-items:center;gap:14px;border:1px solid #ddd6fe;background:#faf5ff;border-radius:14px;padding:12px 14px;margin-bottom:12px;text-decoration:none!important}
.mm-banner.o{border-color:#fed7aa;background:#fff7ed}.mm-banner.r{border-color:#fecaca;background:#fef2f2}.mm-banner.g{border-color:#a7f3d0;background:#ecfdf5}.mm-banner.pk{border-color:#fbcfe8;background:#fdf2f8}.mm-banner.b{border-color:#c7d2fe;background:#eef2ff}
.mm-banner .ic{width:42px;height:42px;border-radius:11px;background:#7c3aed;flex:none}
.mm-banner.o .ic{background:#f97316}.mm-banner.r .ic{background:#ef4444}.mm-banner.g .ic{background:#10b981}.mm-banner.pk .ic{background:#ec4899}.mm-banner.b .ic{background:#4f46e5}
.mm-banner b{display:block;font-weight:500;font-size:17px;color:#0f172a}.mm-banner span{font-size:14px;color:#64748b}
.mm-items a{display:flex;justify-content:space-between;font-size:16px;padding:7px 0;color:#1e293b}
.mm-items small{color:#94a3b8}.mm-new{font-size:12px;background:#dcfce7;color:#15803d;border-radius:99px;padding:2px 8px}
.mm-two{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.mm-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mm-tile{border:1px solid #e2e8f0;border-radius:14px;padding:8px 8px 12px;text-align:center;font-size:14px;color:#334155;text-decoration:none}
.mm-tile i{display:block;height:110px;border-radius:10px;margin-bottom:10px;background:linear-gradient(140deg,#f5f3ff,#e0f2fe)}
.mm-pdfs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mm-pdf{display:flex;gap:12px;border:1px solid #e2e8f0;border-radius:14px;padding:10px;font-size:15px;color:#0f172a;text-decoration:none}
.mm-pdf i{width:52px;height:64px;border-radius:6px;background:#1e293b;flex:none}
.mm-pdf em{display:block;font-style:normal;color:#7c3aed;font-size:13px;margin-top:4px}.mm-pdf s{color:#94a3b8}
.mm-pill{display:inline-block;margin-top:10px;background:#f5f3ff;border-radius:12px;padding:8px 14px;color:#7c3aed;font-size:15px;text-decoration:none}
.mm-pill.g{background:#ecfdf5;color:#059669}
.mm-foot-list{padding:4px 0 14px;display:grid;gap:12px}
.mm-foot-list a{color:#475569;font-size:15px;text-decoration:none}
.mm-foot-list a:hover{color:#7c3aed}
@media (max-width:1023px){.mm-panel{display:none!important}}
.mm-tile i{display:block}
nav .btn-primary{background:#7c3aed!important;color:#fff!important}
/* Footer */
.v2-footer { border-top: 1px solid #e2e8f0; background: #f8fafc; color: #0f172a; }
.v2-footer .v2-footer-inner { max-width: 1200px; margin: 0 auto; padding: 56px 24px 28px; }
.v2-footer .v2-footer-top { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 48px; }
.v2-footer .v2-footer-brand p { margin: 14px 0 0; font-size: 14px; line-height: 1.6; color: #475569; }
.v2-footer .v2-footer-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.v2-footer .v2-footer-actions a { padding: 7px 12px; border: 1px solid #e2e8f0; border-radius: 999px; background: #fff; font-size: 13px; font-weight: 500; color: #334155; text-decoration: none; }
.v2-footer .v2-footer-actions a:hover { border-color: var(--primary); color: var(--primary); }
.v2-footer h3 { margin: 0 0 16px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #64748b; }
.v2-footer .v2-footer-cats ul { margin: 0; padding: 0; list-style: none; columns: 4 170px; column-gap: 24px; }
.v2-footer .v2-footer-cats li { break-inside: avoid; padding: 4px 0; }
.v2-footer .v2-footer-cats a { font-size: 13.5px; line-height: 1.4; color: #475569; text-decoration: none; }
.v2-footer .v2-footer-cats a:hover { color: var(--primary); }
.v2-footer .v2-footer-bottom { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 40px; padding-top: 20px; border-top: 1px solid #e2e8f0; font-size: 13px; color: #64748b; }
.v2-footer .v2-footer-bottom p { margin: 0; }
.v2-footer .v2-footer-bottom nav { display: flex; flex-wrap: wrap; gap: 6px 20px; }
.v2-footer .v2-footer-bottom a { color: #64748b; text-decoration: none; }
.v2-footer .v2-footer-bottom a:hover { color: var(--primary); }
@media (max-width: 860px) { .v2-footer .v2-footer-top { grid-template-columns: 1fr; gap: 32px; } .v2-footer .v2-footer-cats ul { columns: 2; } }

</style>
<div id="mm-root"></div>
<script>
(function(){
var L={};
function a(t,cls,inner){return '<a href="'+(L[t]||"#")+'"'+(cls?' class="'+cls+'"':'')+'>'+(inner||t)+'</a>';}
function list(items){return items.map(function(t){return a(t)}).join('');}
function items(arr){return arr.map(function(x){var t=x[0],n=x[1]||'';return a(t,'', '<span>'+t+'</span>'+(n==='NEW'?'<span class="mm-new">NEW</span>':n?'<small>'+n+'</small>':''))}).join('');}
function banner(c,t,s){return a(t,'mm-banner '+c,'<i class="ic"></i><div><b>'+t+'</b><span>'+s+'</span></div>');}
var P=__PANELS__;
var root=document.getElementById('mm-root'),panels={},timer;
Object.keys(P).forEach(function(k){var d=document.createElement('div');d.className='mm-panel';d.innerHTML=P[k];root.appendChild(d);panels[k]=d;
 d.addEventListener('mouseenter',function(){clearTimeout(timer)});d.addEventListener('mouseleave',closeSoon);});
function closeAll(){Object.keys(panels).forEach(function(k){panels[k].classList.remove('open')});document.querySelectorAll('[data-mega-menu] > button').forEach(function(b){b.setAttribute('aria-expanded','false')});}
function closeSoon(){clearTimeout(timer);timer=setTimeout(closeAll,150);}
document.querySelectorAll('nav [data-mega-menu] > button').forEach(function(b){var k=b.textContent.trim();if(!panels[k])return;
 function open(){clearTimeout(timer);closeAll();panels[k].classList.add('open');b.setAttribute('aria-expanded','true');}
 b.addEventListener('mouseenter',open);b.addEventListener('mouseleave',closeSoon);
 b.addEventListener('click',function(e){e.preventDefault();panels[k].classList.contains('open')?closeAll():open();});});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll();});
document.addEventListener('mousedown',function(e){if(!e.target.closest('.mm-panel')&&!e.target.closest('[data-mega-menu]'))closeAll();});
document.querySelectorAll('nav a[href]').forEach(function(x){if(x.getAttribute('href').indexOf('/')!==0||x.closest('[data-mega-menu]'))x.setAttribute('href','#');});
})();
</script>
